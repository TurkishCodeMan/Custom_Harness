  - name: seam-fs
    package: "@custom-harness/core-seam-fs"
  - name: seam-subprocess
    package: "@custom-harness/core-seam-subprocess"
  - name: seam-approval
    package: "@custom-harness/core-seam-approval"
  - name: seam-spill
    package: "@custom-harness/core-seam-spill"

